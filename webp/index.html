<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' blob: data:; font-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'none'; object-src 'none'">
<title>RoF WebP</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RoF WebP">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#000;--panel:#1c1c1e;--card:#2a2a2d;--line:#2f2f33;--ink:#f5f5f7;--muted:#8e8e93;--accent:#c6f432;--accent-ink:#131a00;--danger:#ff5a5f;
--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--serif:Didot,"Bodoni 72","Bodoni MT",Georgia,serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
body{padding:calc(env(safe-area-inset-top,0px) + 20px) 16px calc(env(safe-area-inset-bottom,0px) + 32px)}
main{max-width:640px;margin:0 auto}
h1{font-family:var(--serif);font-weight:400;font-size:30px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 22px}
button,label.btn{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:150px;border:1.5px dashed var(--line);border-radius:16px;background:var(--panel);text-align:center;padding:20px}
.drop.over{border-color:var(--accent)}
.drop strong{font-size:17px}
.drop span{color:var(--muted);font-size:13px}
.drop input{display:none}
.group{background:var(--panel);border-radius:16px;padding:14px;margin-top:14px}
.group .t{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--card);border-radius:12px;padding:4px}
.seg button{background:none;border-radius:9px;padding:10px 6px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.hint{color:var(--muted);font-size:13px;margin:8px 2px 0}
.list{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;background:var(--panel);border-radius:14px;padding:10px}
.item img{width:64px;height:64px;object-fit:cover;border-radius:10px;background:var(--card)}
.item .n{font-weight:600;font-size:14px;word-break:break-all}
.item .m{color:var(--muted);font-size:13px}
.item .ok{color:var(--accent)}
.item .err{color:var(--danger)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.primary{background:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:14px;padding:14px;font-size:16px}
.secondary{background:var(--card);border-radius:14px;padding:14px;font-size:16px}
.actions .wide{grid-column:1/-1}
button:disabled{opacity:.35;cursor:default}
.back{display:inline-block;margin-top:26px;color:var(--muted);font-size:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>RoF WebP</h1>
  <p class="sub">Bilder in WebP umwandeln, bereit für WordPress. Alles bleibt auf deinem Gerät.</p>

  <label class="drop" id="drop">
    <strong>Bilder auswählen</strong>
    <span>JPG, PNG, HEIC oder WebP, auch mehrere auf einmal</span>
    <input type="file" id="files" accept="image/*,.heic,.heif" multiple>
  </label>

  <div class="group">
    <p class="t">Größe</p>
    <div class="seg" id="size">
      <button type="button" data-v="2560" aria-pressed="true">Für WordPress</button>
      <button type="button" data-v="0" aria-pressed="false">Originalgröße</button>
    </div>
    <p class="hint" id="sizeHint">Längste Seite höchstens 2560 Pixel. So verkleinert WordPress das Bild nicht noch einmal selbst.</p>
  </div>

  <div class="group">
    <p class="t">Qualität</p>
    <div class="seg" id="quality">
      <button type="button" data-v="high" aria-pressed="true">Sehr hoch</button>
      <button type="button" data-v="lossless" aria-pressed="false">Verlustfrei</button>
    </div>
    <p class="hint" id="qHint">Kein sichtbarer Unterschied zum Original, deutlich kleinere Datei.</p>
  </div>

  <div class="list" id="list"></div>

  <div class="actions">
    <button type="button" class="primary wide" id="convert" disabled>Umwandeln</button>
    <button type="button" class="secondary" id="share" hidden>Teilen oder sichern</button>
    <button type="button" class="secondary" id="save" hidden>Als Datei laden</button>
  </div>

  <a class="back" href="../">Zurück zum Bildstudio</a>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
